name: Pact contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tracked files
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          test -z "$tracked" || { printf '%s\n' "$tracked"; exit 1; }
      - run: npm ci
      - name: Check summary failure handling
        run: python3 -m unittest discover -s scripts -p test_summary.py
      - name: Consumer and hosted provider verification
        id: tests
        run: |
          cp .env.example .env
          npm test
      - name: Publish summary and enforce results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: pact-results
          path: results/
          retention-days: 14
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar relatórios e evidências](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nArtifact indisponível; confira a etapa de upload.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
